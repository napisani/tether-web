name: Core image

# Upstream Tether documents its container as local-build only, so this
# workflow publishes an unofficial image from an unmodified upstream release.
# Release steps and recovery: docs/RELEASING.md
on:
  workflow_dispatch:
    inputs:
      tether_tag:
        description: zackb/tether release tag to build (v0.2.35 or newer)
        required: true
      upstream_commit:
        description: Optional full upstream main SHA; tags as VERSION-upstream.SHORTSHA, never latest
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: core-image-${{ inputs.tether_tag }}-${{ inputs.upstream_commit }}
  cancel-in-progress: false

env:
  UPSTREAM: zackb/tether
  IMAGE: ghcr.io/${{ github.repository_owner }}/tether-core

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
      revision: ${{ steps.tag.outputs.revision }}
      latest: ${{ steps.tag.outputs.latest }}
    steps:
      - id: tag
        env:
          TAG: ${{ inputs.tether_tag }}
          COMMIT: ${{ inputs.upstream_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$COMMIT" ] && ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::upstream_commit must be a full lowercase 40-character SHA'
            exit 1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not an upstream vMAJOR.MINOR.PATCH release tag"
            exit 1
          fi
          version="${TAG#v}"
          # 0.2.35 is the first release with the protocol additions tether-web requires.
          if [ "$(printf '%s\n' 0.2.35 "$version" | sort -V | head -1)" != 0.2.35 ]; then
            echo "::error::tether-web requires Tether 0.2.35 or newer"
            exit 1
          fi
          refs=$(git ls-remote "https://github.com/$UPSTREAM.git" "refs/tags/$TAG" "refs/tags/$TAG^{}")
          revision=$(awk -v peeled="refs/tags/$TAG^{}" '$2 == peeled { print $1 }' <<<"$refs")
          revision=${revision:-$(awk '{ print $1; exit }' <<<"$refs")}
          if [ -z "$revision" ]; then
            echo "::error::$TAG does not exist in $UPSTREAM"
            exit 1
          fi
          latest_tag=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          latest=$([ "$latest_tag" = "$TAG" ] && echo true || echo false)
          if [ -n "$COMMIT" ]; then
            git init upstream
            git -C upstream fetch --no-tags "https://github.com/$UPSTREAM.git" main "$TAG"
            git -C upstream merge-base --is-ancestor "$revision" "$COMMIT"
            git -C upstream fetch --no-tags "https://github.com/$UPSTREAM.git" main
            git -C upstream merge-base --is-ancestor "$COMMIT" FETCH_HEAD
            # Snapshot publication is only for upstream main with merged PR261.
            git -C upstream merge-base --is-ancestor 549f6eb16084a3b54320fdabedea16b8bba7c970 "$COMMIT"
            revision="$COMMIT"
            version="$version-upstream.${COMMIT:0:7}"
            latest=false
            # Snapshot names are immutable. Fail closed on unexpected registry errors.
            token=$(curl --fail --silent --show-error "https://ghcr.io/token?scope=repository:${IMAGE#ghcr.io/}:pull" | jq -er .token)
            for suffix in '' -amd64 -arm64; do
              status=$(curl --silent --show-error -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer $token" \
                -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
                "https://ghcr.io/v2/${IMAGE#ghcr.io/}/manifests/$version$suffix")
              if [ "$status" != 404 ]; then
                echo "::error::Refusing to replace or unable to check $version$suffix (HTTP $status)"
                exit 1
              fi
            done
          fi
          {
            echo "version=$version"
            echo "revision=$revision"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    # Native runners: the C++ build and upstream smoke test are impractical under emulation.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      REVISION: ${{ needs.resolve.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false
      - name: Build and run upstream tests
        run: |
          docker build --progress=plain --build-arg TETHER_VERSION="$VERSION" \
            --target test -f packaging/container/Dockerfile -t tether-tests:ci .
      - name: Build runtime
        run: |
          docker build --progress=plain --build-arg TETHER_VERSION="$VERSION" \
            --label org.opencontainers.image.title=tether-core \
            --label "org.opencontainers.image.description=Unofficial build of $UPSTREAM $VERSION for tether-web" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.url=https://github.com/$UPSTREAM" \
            --label "io.tether.upstream.source=https://github.com/$UPSTREAM" \
            --label org.opencontainers.image.licenses=MIT \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --target runtime -f packaging/container/Dockerfile -t tether-runtime:ci .
      - name: Runtime provenance
        run: |
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$REVISION"
          docker run --rm --entrypoint /bin/sh tether-runtime:ci -ec \
            '. /etc/os-release; printf "runtime_os=%s\\n" "$PRETTY_NAME"; dpkg-query -W bluez-obexd; tetherd --version'
      - name: Upstream smoke test
        run: scripts/test-container.sh tether-runtime:ci tether-tests:ci
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image
        run: |
          docker tag tether-runtime:ci "$IMAGE:$VERSION-${{ matrix.arch }}"
          docker push "$IMAGE:$VERSION-${{ matrix.arch }}"

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      LATEST: ${{ needs.resolve.outputs.latest }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch tags
        run: |
          tags=(-t "$IMAGE:$VERSION")
          if [ "$LATEST" = true ]; then tags+=(-t "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.description=Unofficial build of $UPSTREAM $VERSION for tether-web" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
